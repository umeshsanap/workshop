<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureBright AI Workshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* FutureBright Brand Colors from Logo */
            --fb-dark: #0a1628;
            --fb-darker: #050d18;
            --fb-orange: #f5a623;
            --fb-orange-glow: rgba(245, 166, 35, 0.5);
            --fb-cyan: #00d4ff;
            --fb-cyan-glow: rgba(0, 212, 255, 0.5);
            --fb-green: #2ecc71;
            --fb-green-glow: rgba(46, 204, 113, 0.5);
            --fb-blue: #1e90ff;
            --fb-blue-glow: rgba(30, 144, 255, 0.5);
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--fb-darker);
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Circuit Board Pattern */
        .circuit-bg {
            background-color: var(--fb-dark);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(245, 166, 35, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(46, 204, 113, 0.02) 0%, transparent 50%);
            position: relative;
        }
        
        .circuit-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0v10m0 10v10m0 10v10m0 10v10M0 30h10m10 0h10m10 0h10m10 0h10' stroke='%2300d4ff' stroke-width='0.3' fill='none' opacity='0.08'/%3E%3Ccircle cx='30' cy='30' r='2' fill='%2300d4ff' opacity='0.1'/%3E%3Ccircle cx='10' cy='10' r='1.5' fill='%23f5a623' opacity='0.08'/%3E%3Ccircle cx='50' cy='50' r='1.5' fill='%232ecc71' opacity='0.08'/%3E%3Ccircle cx='10' cy='50' r='1' fill='%2300d4ff' opacity='0.06'/%3E%3Ccircle cx='50' cy='10' r='1' fill='%23f5a623' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }
        
        .glass {
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        
        .glass-orange {
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 166, 35, 0.2);
        }
        
        .glass-green {
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 204, 113, 0.2);
        }
        
        /* Neon Glow Effects */
        .neon-cyan {
            text-shadow: 0 0 10px var(--fb-cyan-glow), 0 0 20px var(--fb-cyan-glow), 0 0 40px var(--fb-cyan-glow);
        }
        
        .neon-orange {
            text-shadow: 0 0 10px var(--fb-orange-glow), 0 0 20px var(--fb-orange-glow), 0 0 40px var(--fb-orange-glow);
        }
        
        .neon-green {
            text-shadow: 0 0 10px var(--fb-green-glow), 0 0 20px var(--fb-green-glow), 0 0 40px var(--fb-green-glow);
        }
        
        .box-glow-cyan {
            box-shadow: 0 0 20px var(--fb-cyan-glow), 0 0 40px rgba(0, 212, 255, 0.2);
        }
        
        .box-glow-orange {
            box-shadow: 0 0 20px var(--fb-orange-glow), 0 0 40px rgba(245, 166, 35, 0.2);
        }
        
        .box-glow-green {
            box-shadow: 0 0 20px var(--fb-green-glow), 0 0 40px rgba(46, 204, 113, 0.2);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, var(--fb-orange), var(--fb-cyan), var(--fb-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-slow {
            animation: float 8s ease-in-out infinite;
        }
        .animate-float-delay {
            animation: float 5.5s ease-in-out 0.5s infinite;
        }
        .animate-float-subtle {
            animation: float-subtle 7s ease-in-out infinite;
        }
        .animate-float-x {
            animation: float-x 6s ease-in-out infinite;
        }
        .animate-float-3d {
            animation: float-3d 9s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes float-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes float-x {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(12px); }
        }
        @keyframes float-3d {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) translateX(4px) rotate(1deg); }
            50% { transform: translateY(-16px) translateX(-4px) rotate(-1deg); }
            75% { transform: translateY(-8px) translateX(4px) rotate(0.5deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        
        /* Fade-in animations */
        .animate-fade-in {
            animation: fade-in 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-left {
            animation: fade-in-left 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-right {
            animation: fade-in-right 0.6s ease-out forwards;
            opacity: 0;
        }
        .animate-scale-in {
            animation: scale-in 0.5s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fade-in {
            to { opacity: 1; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-left {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fade-in-right {
            from { opacity: 0; transform: translateX(-24px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Stagger delays (use style="--stagger: 0" to "5" or more) */
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }
        .stagger-7 { animation-delay: 0.7s; }
        .stagger-8 { animation-delay: 0.8s; }
        
        /* Text reveal / increment (character or word stagger) */
        .animate-char-reveal {
            display: inline-block;
            animation: char-reveal 0.4s ease-out forwards;
            opacity: 0;
        }
        @keyframes char-reveal {
            from { opacity: 0; transform: translateY(0.4em); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Shine / shimmer */
        .animate-shine {
            position: relative;
            overflow: hidden;
        }
        .animate-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shine 2.5s ease-in-out infinite;
        }
        @keyframes shine {
            to { left: 200%; }
        }
        
        /* Subtle glow pulse */
        .animate-glow-pulse {
            animation: glow-pulse 2.5s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.08); }
        }
        
        /* Slide-in for panels */
        .animate-slide-in-right {
            animation: slide-in-right 0.4s ease-out forwards;
        }
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--fb-darker);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--fb-cyan), var(--fb-green));
            border-radius: 4px;
        }
        
        /* Section backgrounds */
        .section-alt {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.02) 0%, transparent 100%);
        }
        
        .section-alt-2 {
            background: linear-gradient(180deg, rgba(245, 166, 35, 0.02) 0%, transparent 100%);
        }
        
        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body class="circuit-bg min-h-screen">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
